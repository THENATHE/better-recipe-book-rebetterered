plugins { id 'net.fabricmc.fabric-loom' version '1.17.20' }
version = project.mod_version
group = 'marsh.town.brb'
base { archivesName = 'better-recipe-book-rebetterered' }
repositories {
    mavenCentral()
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://api.modrinth.com/maven' }
}
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.3'
    implementation('me.shedaniel.cloth:cloth-config-fabric:26.3.159') {
        exclude group: 'net.fabricmc.fabric-api'
    }
    include 'me.shedaniel.cloth:cloth-config-fabric:26.3.159'
    compileOnly 'maven.modrinth:modmenu:21.0.0'
    compileOnly 'maven.modrinth:mouse-wheelie:1.13.3+mc1.20.4'
}
sourceSets {
    main {
        java.srcDirs = ['common/src/main/java', 'fabric/src/main/java']
        resources.srcDirs = ['common/src/main/resources', 'fabric/src/main/resources']
    }
    test { java.srcDirs = ['src/test/java'] }
    regression {
        java.srcDirs = ['../qa/craft-tests', '../qa/tests', '../qa/creative']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    clientqa {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}
loom { accessWidenerPath = file('common/src/main/resources/brb.common.accesswidener') }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
    exclude('**/*.ase', '**/*.kra')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
def regressionChecks = [
    craftingRegression: 'CraftRequestChecksTest',
    pinRegression: 'PinPersistenceChecks',
    creativeRegression: 'CreativeRuleChecks'
]
regressionChecks.each { taskName, entrypoint ->
    tasks.register(taskName, JavaExec) {
        dependsOn tasks.named('regressionClasses')
        classpath = sourceSets.regression.runtimeClasspath
        mainClass = entrypoint
        if (taskName == 'creativeRegression') {
            args file('common/src/main/resources/assets/brb/creative-groups.json').absolutePath
        }
    }
}
tasks.named('check') { dependsOn regressionChecks.keySet() }
jar { from('LICENSE') { rename { 'LICENSE_BetterRecipeBook' } } }
tasks.register('clientqaJar', Jar) {
    dependsOn tasks.named('clientqaClasses')
    archiveBaseName = 'brb-client-qa'; archiveVersion = '1'
    destinationDirectory = layout.buildDirectory.dir('qa')
    from sourceSets.clientqa.output
}
if (project.hasProperty('clientQa')) {
    def qaSuite = project.findProperty('qaSuite') ?: 'all'
    def qaRun = file(qaSuite == 'all' ? '../qa/client-run' : '../qa/client-' + qaSuite)
    loom.runs.client { runDir = qaRun.absolutePath; vmArg '-Dfabric.client.gametest'; vmArg '-Dbrb.qaSuite=' + qaSuite }
    tasks.register('prepareClientQa') {
        dependsOn tasks.named('clientqaJar')
        doLast {
            new File(qaRun, 'mods').mkdirs()
            copy { from tasks.named('clientqaJar').get().archiveFile; into new File(qaRun, 'mods') }
            new File(qaRun, 'options.txt').text = 'renderDistance:2\nsimulationDistance:5\nmaxFps:30\nsoundCategory_master:0.0\n'
        }
    }
    tasks.named('runClient') { dependsOn tasks.named('prepareClientQa') }
}
