name: build
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: bash gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: brb-fabric-26.3
          path: build/libs/*.jar
