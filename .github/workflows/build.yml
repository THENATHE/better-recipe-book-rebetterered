name: Build and regression checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ported
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: bash gradlew --no-daemon clean check build clientqaJar
      - uses: actions/upload-artifact@v4
        with:
          name: better-recipe-book-rebetterered
          path: ported/build/libs/*.jar
